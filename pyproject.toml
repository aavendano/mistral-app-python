[project]
name = "code-review-agent"
version = "0.1.0"
description = "Conversational code review and implementation agent, built with the Mistral Agents SDK and deployed on Mistral Cloud as a managed deployment."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mistralai-agents[cli,sessions-client]==1.1.3",
]

[dependency-groups]
dev = [
    "mcp>=1.12",
]

[tool.mistralai.agents]
entrypoint = "main:agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
